<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cinezo — Snacks, delivered to your seat</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Scan the QR on your seat, order popcorn &amp; snacks, pay with UPI, and get it delivered without missing a scene.">
<meta name="theme-color" id="metaTheme" content="#0B0A12">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="cinezo — In-seat cinema dining">
<meta property="og:description" content="No app. No queue. No missed scenes.">
<link rel="icon" href="images/cinezo-favicon.svg" type="image/svg+xml">
<link rel="icon" href="images/favicon.ico" sizes="32x32 16x16" type="image/x-icon">
<link rel="apple-touch-icon" href="images/cinezo-icon.svg">
<script>/* apply saved theme before first paint */try{var _t=JSON.parse(localStorage.getItem("ss_theme"));if(_t==="light"){document.documentElement.dataset.theme="light";document.getElementById("metaTheme").content="#F5EFE3"}}catch(e){}</script>
<style>
:root{
  --bg:#0B0A12; --sf:#151322; --sf2:#1E1A30; --glass:rgba(19,17,31,.72);
  --tx:#F5F0E6; --mu:#9C94AC;
  --ac:#C9A227; --ac2:#F3D27A; --gold:linear-gradient(135deg,#F6D98A,#D4A437 55%,#B8860B);
  --ink:#221806;
  --ok:#3ECF8E; --er:#FF6B6B;
  --bd:rgba(255,255,255,.09); --bd2:rgba(255,255,255,.14);
  --sh:0 18px 44px rgba(0,0,0,.45); --shs:0 8px 22px rgba(0,0,0,.35);
  --glow:0 10px 30px rgba(212,164,55,.26);
  --r:22px; --rb:16px;
  --hh:62px;
  --ez:cubic-bezier(.22,1,.36,1);
  --grain:.05;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F5EFE3; --sf:#FFFDF7; --sf2:#F0E7D5; --glass:rgba(255,253,247,.78);
  --tx:#241D10; --mu:#877D69;
  --ac:#A87B0B; --ac2:#B8860B;
  --bd:rgba(70,48,4,.13); --bd2:rgba(70,48,4,.22);
  --sh:0 16px 38px rgba(96,64,8,.15); --shs:0 6px 18px rgba(96,64,8,.12);
  --glow:0 10px 26px rgba(184,134,11,.24);
  --grain:.035;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:calc(var(--hh) + env(safe-area-inset-top,0px))}
body{
  margin:0;min-height:100dvh;background:var(--bg);color:var(--tx);
  font:15px/1.5 Inter,system-ui,-apple-system,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;transition:background .45s,color .45s;
}
::selection{background:rgba(212,164,55,.35)}
</style>
<link rel="stylesheet" href="style.css?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="stage" aria-hidden="true"><div class="beam"></div></div>
<div class="grain" aria-hidden="true"></div>
<div class="w" id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<noscript>cinezo needs JavaScript to take your order. Please enable it and reload.</noscript>
<script src="app.js?v=2" defer></script>
</body>
</html>
